<header><div class="nav"><div class="brand"><span class="brandmark" data-icon="gavel"></span>밥판사</div><button class="help" id="help"><span data-icon="help"></span>이용 방법</button></div></header>
<main id="app"></main>
<dialog id="guide" aria-labelledby="guide-title"><div class="diag-top"><h2 id="guide-title">이용 방법</h2><button id="close" aria-label="닫기" data-icon="x"></button></div><ol class="guide-list"><li><strong>배심원을 모아요</strong><p>친구 2~4명이 휴대폰 한 대를 돌려 써요.</p></li><li><strong>메뉴 8장을 차례로 판정해요</strong><p>피하고 싶은 메뉴는 패스, 함께 먹을 수 있으면 좋아를 눌러요. 특히 당기는 메뉴에는 별을 한 번 쓸 수 있어요.</p></li><li><strong>오늘의 메뉴를 선고해요</strong><p>모두가 괜찮다고 한 메뉴 중 별이 가장 많은 메뉴를 골라요. 동률이면 판사봉으로 추첨해요. 공통 메뉴가 없으면 재심하거나 휴정해요.</p></li></ol><button class="primary" id="understood">알겠어요</button></dialog>

<script>"use strict";
const menus = [
  ["돈가스","donkatsu"], ["국밥","gukbap"], ["김치찌개","kimchi_stew"], ["비빔밥","bibimbap"],
  ["쌀국수","pho"], ["마라탕","malatang"], ["파스타","pasta"], ["햄버거","burger"]
];
function tally(ballots) {
  const counts = menus.map((_, id) => ({
    id, passes: ballots.filter(row => row[id] === "pass").length,
    stars: ballots.filter(row => row[id] === "star").length
  }));
  const common = counts.filter(menu => menu.passes === 0);
  if (!common.length) {
    const possible = counts.filter(menu => menu.passes < ballots.length);
    const candidate = possible.find(menu => menu.passes === Math.min(...possible.map(item => item.passes)));
    return candidate ? {mode:"review", common, id:candidate.id} :
      {mode:"adjourn", common, reason:"모든 메뉴에 패스가 나왔어요. 오늘은 다른 메뉴를 찾아봐요."};
  }
  const highest = Math.max(...common.map(menu => menu.stars));
  const leaders = common.filter(menu => menu.stars === highest);
  if (leaders.length > 1) return {mode:"draw", common, leaders, reason:highest ?
    "별 개수가 같은 공통 메뉴 중에서 뽑았어요." : "모두가 괜찮다고 한 메뉴 중에서 뽑았어요."};
  return {mode:"verdict", common, id:leaders[0].id, reason:common.length === 1 ?
    "모두가 괜찮다고 한 유일한 메뉴예요." : "모두가 괜찮다고 한 메뉴 중 별이 가장 많았어요."};
}
</script>

 return '<div class="home"><section class="hero"><div class="hero-copy"><span class="pill hero-chip">'+icon("gavel")+'오늘의 메뉴 재판</span><h1>오늘 뭐 먹지?<br><em>재판으로 결정하자!</em></h1><p>친구들과 메뉴를 판정하고, 모두가 함께 먹을<br class="mobile-break"> 오늘의 한 끼를 골라요.</p></div><div class="hero-art" aria-hidden="true"><i class="orbit o1"></i><i class="orbit o2"></i><i class="spark s1">✦</i><i class="spark s2">✦</i><i class="spark s3">✧</i><div class="hero-card rear">'+art(3)+'<span class="sticker yellow">'+icon("star")+'</span></div><div class="hero-card front">'+art(0)+'<span class="sticker lime">'+icon("check")+'</span></div></div></section>'+

 const row=ballots[juror], n=row.length, spent=row.includes("star");
 const buttons=[["pass","x","오늘은 패스"],["like","check","먹어도 좋아"],["star","star","오늘 이거!"]];
 return '<div class="play-head">'+chip("jury","배심원 "+(juror+1)+"번")+'<span>메뉴 <b>'+(n+1)+'</b> / 8</span></div><div class="progress" aria-hidden="true">'+menus.map((_,i)=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</div><article class="food-card">'+chip("star","남은 별 "+(spent?0:1)+"개","star-chip")+art(n)+'<h1>'+menus[n][0]+'</h1></article><div class="votes">'+buttons.map(([vote,symbol,label])=>'<button data-vote="'+vote+'" '+(vote==="star"&&spent?'disabled':'')+'><span class="circle '+vote+'">'+icon(symbol)+'</span>'+label+'</button>').join('')+'</div><p class="star-note">'+(spent?"별을 이미 사용했어요.":"먹어도 좋고 특히 당기는 메뉴에 써요.<br>한 판에 한 번 쓸 수 있어요.")+'</p>';
}
function foodCard(id,stamp=""){return '<div class="result-food">'+art(id)+(stamp?'<span class="stamp">'+stamp+'</span>':'')+'<h2>'+menus[id][0]+'</h2></div>';}
function result(){
 const r=outcome;
 if(r.mode==="draw")return chip("gavel","동률 추첨")+'<h1>최종 후보가 나왔어요!</h1><p>동률인 메뉴 중 하나를 판사봉으로 뽑아요.</p><div class="candidates">'+r.leaders.map(m=>'<div>'+art(m.id)+'<strong>'+menus[m.id][0]+'</strong>'+chip("star",m.stars+"개","star-chip")+'</div>').join('')+'</div>'+primary("draw","판사봉 눌러 추첨","gavel");
 if(r.mode==="review")return chip("gavel","재심 심리")+'<h1>이 메뉴는 다 같이 괜찮나요?</h1><p>공통 메뉴가 없어요. 한 명씩 의견을 확인해 주세요.</p>'+foodCard(r.id)+primary("agree","모두 괜찮아요","check")+'<button class="secondary" data-action="adjourn">휴정하기</button>';
 if(r.mode==="adjourn")return '<div class="rest-art"><img src="'+foodAssets.gavel+'" alt=""><span aria-hidden="true">쿨쿨</span></div><h1>오늘은 휴정합니다</h1><p>'+r.reason+'</p>'+primary("reset","새 재판 시작하기","gavel");
 const name=menus[r.id][0], josa=(name.charCodeAt(name.length-1)-44032)%28;
 return chip("gavel","최종 판결")+'<h1>오늘은 '+name+(josa&&josa!==8?"으로":"로")+' 판결!</h1><p>'+r.reason+'</p>'+foodCard(r.id,"선고 확정")+'<div class="summary"><h2>공통 후보 <span>'+r.common.length+'개</span></h2>'+(r.common.length?r.common.map(m=>'<div class="summary-row"><span>'+menus[m.id][0]+'</span>'+chip("star",m.stars+"개","star-chip")+'</div>').join(''):'<p>공통 후보가 없어 재심으로 결정했어요.</p>')+'</div>'+primary("reset","새 재판","gavel");
}
function render(move=true){
 let content;
 if(screen==="setup") content=setup();
 else{
 let body;
 if(screen==="vote")body=voting();
 else if(screen==="handover")body='<div class="handover-graphic">'+icon("phone")+'</div>'+chip("jury","배심원 교대")+'<h1>휴대폰을 '+(juror+1)+'번 배심원에게<br>넘겨주세요</h1><p>본인의 차례가 되면 아래 버튼을 눌러주세요.</p>'+primary("next","내 차례 시작");
 else body=result();
 content='<section class="play '+screen+'">'+body+'</section>';
 }
 app.innerHTML=content;
 if(move){window.scrollTo(0,0);const heading=app.querySelector("h1");if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}
}
function guard(){lockedUntil=performance.now()+400;}
app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b||b.disabled||performance.now()<lockedUntil)return;
 if(b.dataset.people && screen==="setup"){people=Number(b.dataset.people);app.querySelectorAll("[data-people]").forEach(el=>el.setAttribute("aria-pressed",String(Number(el.dataset.people)===people)));return;}
 if(b.dataset.vote&&screen==="vote"){
 const row=ballots[juror], v=b.dataset.vote;if(row.length>=8||(v==="star"&&row.includes("star")))return;
 row.push(v);
 if(row.length===8){if(juror+1===people){outcome=tally(ballots);screen="result";}else{juror++;screen="handover";}}
 }else{
 const action=b.dataset.action;
 if(action==="start"&&screen==="setup"){ballots=Array.from({length:people},()=>[]);screen="vote";}
 else if(action==="next"&&screen==="handover"){screen="vote";}
 else if(screen==="result"&&action==="draw"&&outcome.mode==="draw"){const chosen=outcome.leaders[Math.floor(Math.random()*outcome.leaders.length)];outcome={...outcome,mode:"verdict",id:chosen.id};}
 else if(screen==="result"&&outcome.mode==="review"&&action==="agree"){outcome={...outcome,mode:"verdict",reason:"재심에서 전원이 동의했어요."};}
 else if(screen==="result"&&outcome.mode==="review"&&action==="adjourn"){outcome={mode:"adjourn",reason:"재심 후보에 모두가 동의하지 않아 이번 재판을 마쳐요."};}
 else if(screen==="result"&&action==="reset"){reset();}
 else return;
 }
 guard();render();
});
reset();render(false);
</script>
</body></html>
